name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pytest
        run: |
          python -m pytest

  quality:
    name: Quality & Packaging (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check code formatting (Ruff)
        run: |
          ruff format --check .

      - name: Lint codebase (Ruff)
        run: |
          ruff check .

      - name: Static type checking (mypy)
        run: |
          mypy src
          mypy tests

      - name: Build distribution packages
        run: |
          python -m build

      - name: Validate distribution metadata (twine)
        run: |
          python -m twine check dist/*

      - name: Wheel smoke test in isolated environment
        run: |
          mkdir -p /tmp/wheel_smoke
          cd /tmp/wheel_smoke

          python -m venv smoke_venv
          ./smoke_venv/bin/python -m pip install --upgrade pip
          ./smoke_venv/bin/python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl

          ./smoke_venv/bin/python - <<'PY'
          from importlib.metadata import version
          import fa_redact

          print(f"Imported fa_redact from: {fa_redact.__file__}")

          assert "site-packages" in fa_redact.__file__, "Package was not imported from site-packages"
          installed_version = version("fa-redact")
          assert fa_redact.__version__ == installed_version, (
              f"Version mismatch: __version__ ({fa_redact.__version__}) != installed metadata ({installed_version})"
          )

          # Verify callable validators and functions
          assert callable(fa_redact.detect)
          assert callable(fa_redact.redact)
          assert callable(fa_redact.is_valid_national_id)
          assert callable(fa_redact.is_valid_mobile_number)
          assert callable(fa_redact.is_valid_iranian_iban)
          assert callable(fa_redact.is_valid_email)
          assert callable(fa_redact.is_valid_bank_card_number)
          assert callable(fa_redact.resolve_detection_conflicts)

          # Verify detector and configuration classes
          assert fa_redact.PseudonymizationSession is not None
          assert fa_redact.IranianNationalIDDetector is not None
          assert fa_redact.IranianMobileNumberDetector is not None
          assert fa_redact.IranianIBANDetector is not None
          assert fa_redact.EmailDetector is not None
          assert fa_redact.BankCardDetector is not None
          assert fa_redact.PatternDetector is not None
          assert fa_redact.PatternRule is not None
          assert fa_redact.ConflictPolicy is not None

          result = fa_redact.redact("کد ملی: ۱۲۳۴۵۶۷۸۹۱")
          assert "[IR_NATIONAL_ID_1]" in result

          print("Wheel smoke test passed.")
          PY
