name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pytest
        run: |
          python -m pytest

  quality:
    name: Quality & Packaging (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check code formatting (Ruff)
        run: |
          ruff format --check .

      - name: Lint codebase (Ruff)
        run: |
          ruff check .

      - name: Static type checking (mypy)
        run: |
          mypy src
          mypy tests

      - name: Build distribution packages
        run: |
          python -m build

      - name: Validate distribution metadata (twine)
        run: |
          python -m twine check dist/*

      - name: Verify distribution contents
        run: |
          python -c "
          import tarfile
          import zipfile
          from pathlib import Path

          wheels = list(Path('dist').glob('*.whl'))
          sdists = list(Path('dist').glob('*.tar.gz'))

          assert len(wheels) == 1, f'Expected exactly 1 wheel, found {len(wheels)}'
          assert len(sdists) == 1, f'Expected exactly 1 sdist, found {len(sdists)}'

          wheel_path = wheels[0]
          sdist_path = sdists[0]
          print(f'Checking sdist: {sdist_path.name}')
          print(f'Checking wheel: {wheel_path.name}')

          # Verify matching package version in filenames
          import re
          wheel_match = re.search(r'fa_redact-([0-9]+\.[0-9]+\.[0-9]+)', wheel_path.name)
          sdist_match = re.search(r'fa_redact-([0-9]+\.[0-9]+\.[0-9]+)', sdist_path.name)
          assert wheel_match and sdist_match, 'Could not parse version from distribution filenames'
          assert wheel_match.group(1) == sdist_match.group(1), (
              f'Version mismatch in filenames: wheel={wheel_match.group(1)}, sdist={sdist_match.group(1)}'
          )

          # 1. Audit sdist contents
          with tarfile.open(sdist_path, 'r:gz') as archive:
              sdist_names = archive.getnames()

          required_sdist_files = [
              'CHANGELOG.md',
              'README.md',
              'LICENSE',
              'pyproject.toml',
              'src/fa_redact/__init__.py',
              'src/fa_redact/__main__.py',
              'src/fa_redact/cli.py',
              'src/fa_redact/conflicts.py',
              'src/fa_redact/reporting.py',
              'src/fa_redact/structured.py',
              'src/fa_redact/detectors/pattern.py',
              'tests/test_package.py',
              'tests/test_structured.py',
          ]
          for req in required_sdist_files:
              assert any(name.endswith('/' + req) or name == req for name in sdist_names), (
                  f'Required file {req} missing from sdist archive: {sdist_path.name}'
              )

          # 2. Audit wheel contents
          with zipfile.ZipFile(wheel_path, 'r') as z:
              wheel_names = set(z.namelist())

          required_wheel_entries = [
              'fa_redact/__init__.py',
              'fa_redact/__main__.py',
              'fa_redact/cli.py',
              'fa_redact/conflicts.py',
              'fa_redact/reporting.py',
              'fa_redact/structured.py',
              'fa_redact/py.typed',
              'fa_redact/detectors/email.py',
              'fa_redact/detectors/iranian_iban.py',
              'fa_redact/detectors/bank_card.py',
              'fa_redact/detectors/pattern.py',
              'fa_redact/validators/email.py',
              'fa_redact/validators/iranian_iban.py',
              'fa_redact/validators/bank_card.py',
          ]
          for req in required_wheel_entries:
              assert req in wheel_names, (
                  f'Required module {req} missing from wheel: {wheel_path.name}'
              )

          print('Distribution contents audit passed successfully.')
          "

      - name: Wheel smoke test in isolated environment
        run: |
          mkdir -p /tmp/wheel_smoke
          cd /tmp/wheel_smoke

          python -m venv smoke_venv
          ./smoke_venv/bin/python -m pip install --upgrade pip
          ./smoke_venv/bin/python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl

          ./smoke_venv/bin/python - <<'PY'
          from importlib.metadata import version
          import subprocess
          import sys
          import fa_redact
          from fa_redact.cli import main as cli_main

          print(f"Imported fa_redact from: {fa_redact.__file__}")

          assert "site-packages" in fa_redact.__file__, "Package was not imported from site-packages"
          installed_version = version("fa-redact")
          assert fa_redact.__version__ == installed_version, (
              f"Version mismatch: __version__ ({fa_redact.__version__}) != installed metadata ({installed_version})"
          )

          # Verify callable validators and functions
          assert callable(fa_redact.detect)
          assert callable(fa_redact.detect_fields)
          assert callable(fa_redact.redact)
          assert callable(fa_redact.redact_fields)
          assert callable(fa_redact.detection_report)
          assert callable(fa_redact.report_detections)
          assert callable(fa_redact.report_fields)
          assert callable(fa_redact.is_valid_national_id)
          assert callable(fa_redact.is_valid_mobile_number)
          assert callable(fa_redact.is_valid_iranian_iban)
          assert callable(fa_redact.is_valid_email)
          assert callable(fa_redact.is_valid_bank_card_number)
          assert callable(fa_redact.resolve_detection_conflicts)
          assert callable(cli_main)

          # Verify detector, report, and configuration classes
          assert fa_redact.DetectionReport is not None
          assert fa_redact.PseudonymizationSession is not None
          assert fa_redact.IranianNationalIDDetector is not None
          assert fa_redact.IranianMobileNumberDetector is not None
          assert fa_redact.IranianIBANDetector is not None
          assert fa_redact.EmailDetector is not None
          assert fa_redact.BankCardDetector is not None
          assert fa_redact.PatternDetector is not None
          assert fa_redact.PatternRule is not None
          assert fa_redact.ConflictPolicy is not None

          result = fa_redact.redact("کد ملی: ۱۲۳۴۵۶۷۸۹۱")
          assert "[IR_NATIONAL_ID_1]" in result

          # Verify Phase 18 detection_report smoke and privacy
          report = fa_redact.detection_report("کد ملی: ۱۲۳۴۵۶۷۸۹۱")
          assert report.total_detections == 1
          assert report.counts["IR_NATIONAL_ID"] == 1
          assert "۱۲۳۴۵۶۷۸۹۱" not in repr(report)
          assert "1234567891" not in repr(report)

          # Verify Phase 19 CLI console entry point and -m execution
          res = subprocess.run(
              [sys.executable, "-m", "fa_redact", "--version"],
              capture_output=True,
              text=True,
              check=True,
          )
          assert f"fa-redact {installed_version}" in res.stdout

          res_redact = subprocess.run(
              [sys.executable, "-m", "fa_redact", "redact"],
              input="کد ملی: ۱۲۳۴۵۶۷۸۹۱",
              capture_output=True,
              text=True,
              encoding="utf-8",
              check=True,
          )
          assert "[IR_NATIONAL_ID_1]" in res_redact.stdout

          # Verify Phase 20 structured data helpers smoke
          record = {"meta": {"note": "کد ملی ۱۲۳۴۵۶۷۸۹۱"}, "age": 30}
          redacted_rec = fa_redact.redact_fields(record, ["meta.note"])
          assert "[IR_NATIONAL_ID_1]" in redacted_rec["meta"]["note"]
          assert record["meta"]["note"] == "کد ملی ۱۲۳۴۵۶۷۸۹۱"
          assert redacted_rec["age"] == 30

          print("Wheel smoke test passed.")
          PY
