name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build & Validate Distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Verify release tag matches package and pyproject versions
        run: |
          TAG="${{ github.event.release.tag_name }}"

          # Enforce strict lowercase 'v' prefix convention
          case "$TAG" in
            v*)
              ;;
            *)
              echo "Error: release tag '$TAG' must start with lowercase 'v' (example: v0.2.0)"
              exit 1
              ;;
          esac

          EXPECTED_VERSION="${TAG#v}"

          if [ -z "$EXPECTED_VERSION" ]; then
              echo "Error: release tag '$TAG' contains no version after 'v'"
              exit 1
          fi

          python -c "
          import sys
          import tomllib
          from pathlib import Path

          sys.path.insert(0, 'src')
          import fa_redact

          expected_ver = sys.argv[1]
          tag_name = sys.argv[2]
          pkg_ver = fa_redact.__version__

          with Path('pyproject.toml').open('rb') as f:
              pyproject_data = tomllib.load(f)
          pyproject_ver = pyproject_data.get('project', {}).get('version')

          print(f'Release tag: {tag_name} -> Expected version: {expected_ver}')
          print(f'pyproject.toml version: {pyproject_ver}')
          print(f'fa_redact.__version__: {pkg_ver}')

          if pyproject_ver != expected_ver:
              raise ValueError(
                  f'Version mismatch: tag specifies {expected_ver} but pyproject.toml has {pyproject_ver}'
              )
          if pkg_ver != expected_ver:
              raise ValueError(
                  f'Version mismatch: tag specifies {expected_ver} but fa_redact.__version__ is {pkg_ver}'
              )
          print('Three-way pre-build version consistency check passed.')
          " "$EXPECTED_VERSION" "$TAG"

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Validate distribution metadata (twine)
        run: |
          python -m twine check dist/*

      - name: Verify distribution contents
        run: |
          TAG="${{ github.event.release.tag_name }}"
          EXPECTED_VERSION="${TAG#v}"
          python - "$EXPECTED_VERSION" <<'PY'
          import re
          import sys
          import tarfile
          import zipfile
          from pathlib import Path

          expected_ver = sys.argv[1]
          wheels = list(Path('dist').glob('*.whl'))
          sdists = list(Path('dist').glob('*.tar.gz'))

          assert len(wheels) == 1, f"Expected exactly 1 wheel, found {len(wheels)}"
          assert len(sdists) == 1, f"Expected exactly 1 sdist, found {len(sdists)}"

          wheel_path = wheels[0]
          sdist_path = sdists[0]
          print(f"Auditing sdist: {sdist_path.name}")
          print(f"Auditing wheel: {wheel_path.name}")

          # Verify matching package version in filenames and expected version
          wheel_match = re.search(r'fa_redact-([0-9]+\.[0-9]+\.[0-9]+)', wheel_path.name)
          sdist_match = re.search(r'fa_redact-([0-9]+\.[0-9]+\.[0-9]+)', sdist_path.name)
          assert wheel_match and sdist_match, "Could not parse version from filenames"
          assert wheel_match.group(1) == expected_ver, f"Wheel version {wheel_match.group(1)} != {expected_ver}"
          assert sdist_match.group(1) == expected_ver, f"Sdist version {sdist_match.group(1)} != {expected_ver}"

          # 1. Audit wheel contents
          with zipfile.ZipFile(wheel_path, 'r') as z:
              wheel_names = z.namelist()

          required_wheel_entries = [
              'fa_redact/__init__.py',
              'fa_redact/__main__.py',
              'fa_redact/batch.py',
              'fa_redact/cli.py',
              'fa_redact/clinical.py',
              'fa_redact/conflicts.py',
              'fa_redact/reporting.py',
              'fa_redact/serialization.py',
              'fa_redact/structured.py',
              'fa_redact/detectors/persian_ner.py',
              'fa_redact/detectors/legal_entity_id.py',
              'fa_redact/validators/legal_entity_id.py',
              'fa_redact/py.typed',
          ]
          for req in required_wheel_entries:
              assert req in wheel_names, f"Required module {req} missing from wheel: {wheel_path.name}"

          forbidden_wheel_patterns = [
              'tests/',
              'research/',
              '.safetensors',
              '.pt',
              '.pth',
              '.onnx',
              '.env',
              '.gemini',
              'antigravity',
              'credentials',
          ]
          for name in wheel_names:
              for pattern in forbidden_wheel_patterns:
                  assert pattern not in name.lower(), f"Forbidden pattern '{pattern}' found in wheel entry: {name}"

          # 2. Audit sdist contents
          with tarfile.open(sdist_path, 'r:gz') as archive:
              sdist_names = archive.getnames()

          required_sdist_files = [
              'CHANGELOG.md',
              'README.md',
              'LICENSE',
              'pyproject.toml',
              'src/fa_redact/__init__.py',
              'src/fa_redact/__main__.py',
              'src/fa_redact/batch.py',
              'src/fa_redact/cli.py',
              'src/fa_redact/clinical.py',
              'src/fa_redact/reporting.py',
              'src/fa_redact/serialization.py',
              'src/fa_redact/structured.py',
              'src/fa_redact/detectors/persian_ner.py',
              'src/fa_redact/detectors/legal_entity_id.py',
              'src/fa_redact/validators/legal_entity_id.py',
          ]
          for req in required_sdist_files:
              assert any(name.endswith('/' + req) or name == req for name in sdist_names), (
                  f"Required file {req} missing from sdist archive: {sdist_path.name}"
              )

          forbidden_sdist_patterns = [
              '.safetensors',
              '.pt',
              '.pth',
              '.onnx',
              '.env',
              '.gemini',
              'antigravity',
              'credentials',
          ]
          for name in sdist_names:
              for pattern in forbidden_sdist_patterns:
                  assert pattern not in name.lower(), f"Forbidden pattern '{pattern}' found in sdist entry: {name}"

          print("Release distribution content audit passed successfully.")
          PY

      - name: Release wheel smoke test in isolated environment
        run: |
          mkdir -p /tmp/release_smoke
          cd /tmp/release_smoke

          TAG="${{ github.event.release.tag_name }}"
          EXPECTED_VERSION="${TAG#v}"

          python -m venv smoke_venv
          ./smoke_venv/bin/python -m pip install --upgrade pip
          ./smoke_venv/bin/python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl

          # Verify installed console script directly
          ./smoke_venv/bin/fa-redact --help
          ./smoke_venv/bin/fa-redact --version

          ./smoke_venv/bin/python - "$EXPECTED_VERSION" <<'PY'
          import subprocess
          import sys
          from importlib.metadata import version
          import fa_redact

          expected_ver = sys.argv[1]
          print(f"Imported fa_redact from: {fa_redact.__file__}")

          # 1. Four-way distribution metadata and import path consistency
          assert "site-packages" in fa_redact.__file__, "Not imported from site-packages!"
          assert fa_redact.__version__ == expected_ver, f"Expected runtime version {expected_ver}, got {fa_redact.__version__}"
          dist_ver = version("fa-redact")
          assert dist_ver == expected_ver, f"Expected distribution metadata version {expected_ver}, got {dist_ver}"

          # 2. Existing core (National ID, Mobile, detect, redact, PseudonymizationSession)
          assert callable(fa_redact.is_valid_national_id)
          assert callable(fa_redact.is_valid_mobile_number)
          assert fa_redact.is_valid_national_id("1234567891")
          assert fa_redact.is_valid_mobile_number("09123456789")
          core_redacted = fa_redact.redact("کد ملی: ۱۲۳۴۵۶۷۸۹۱، همراه: ۰۹۱۲۳۴۵۶۷۸۹")
          assert "[IR_NATIONAL_ID_1]" in core_redacted
          assert "[IR_MOBILE_1]" in core_redacted

          session = fa_redact.PseudonymizationSession()
          pseudonymized = session.pseudonymize("کد ملی ۱۲۳۴۵۶۷۸۹۱")
          assert "[IR_NATIONAL_ID_1]" in pseudonymized
          restored = session.restore(pseudonymized)
          assert "۱۲۳۴۵۶۷۸۹۱" in restored

          # 3. Phase 13: Iranian IBAN / Sheba (is_valid_iranian_iban and default detection/redaction)
          assert callable(fa_redact.is_valid_iranian_iban)
          assert fa_redact.is_valid_iranian_iban("IR641234567890123456789012")
          iban_redacted = fa_redact.redact("واریز به شبا IR641234567890123456789012")
          assert "[IR_IBAN_1]" in iban_redacted

          # 4. Phase 12: Email (opt-in behavior)
          assert callable(fa_redact.is_valid_email)
          assert fa_redact.is_valid_email("test@example.com")
          email_detector = fa_redact.EmailDetector()
          email_detections = fa_redact.detect("contact: test@example.com", detectors=[email_detector])
          assert len(email_detections) == 1
          assert email_detections[0].type == "EMAIL"
          # Explicit detector replacement semantics: default detectors not run when explicit list provided
          non_email = fa_redact.detect("کد ملی ۱۲۳۴۵۶۷۸۹۱", detectors=[email_detector])
          assert len(non_email) == 0

          # 5. Phase 14: Bank Card (opt-in behavior, synthetic Luhn-valid 1234567890123452)
          assert callable(fa_redact.is_valid_bank_card_number)
          assert fa_redact.is_valid_bank_card_number("1234567890123452")
          card_detector = fa_redact.BankCardDetector()
          card_detections = fa_redact.detect("کارت 1234567890123452", detectors=[card_detector])
          assert len(card_detections) == 1
          assert card_detections[0].type == "BANK_CARD"

          # 6. Phase 15: PatternDetector / PatternRule
          hospital_detector = fa_redact.PatternDetector(
              [
                  fa_redact.PatternRule(
                      type="MRN",
                      pattern=r"(?<!\w)MRN-[0-9]{6}(?!\w)",
                  )
              ]
          )
          mrn_detections = fa_redact.detect("پرونده: MRN-۱۲۳۴۵۶", detectors=[hospital_detector])
          assert len(mrn_detections) == 1
          assert mrn_detections[0].type == "MRN"
          assert mrn_detections[0].normalized_value == "MRN-123456"
          mrn_redacted = fa_redact.redact("پرونده: MRN-۱۲۳۴۵۶", detectors=[hospital_detector])
          assert "[MRN_1]" in mrn_redacted

          # 7. Phase 16: Conflict Resolution
          assert fa_redact.ConflictPolicy is not None
          assert callable(fa_redact.resolve_detection_conflicts)
          overlap_text = "1234567890123452@example.com"
          dual_detectors = [fa_redact.EmailDetector(), fa_redact.BankCardDetector()]
          raw_conflicts = fa_redact.detect(overlap_text, detectors=dual_detectors)
          assert len(raw_conflicts) == 2  # raw detect preserves overlapping evidence

          # Default reject policy raises ValueError
          try:
              fa_redact.redact(overlap_text, detectors=dual_detectors)
              assert False, "Expected ValueError on unhandled conflict under default reject policy"
          except ValueError:
              pass

          # Longest policy resolves to EMAIL
          resolved_redacted = fa_redact.redact(
              overlap_text,
              detectors=dual_detectors,
              conflict_policy="longest",
          )
          assert resolved_redacted == "[EMAIL_1]"

          # 8. Phase 18: DetectionReport / report_detections / detection_report
          assert fa_redact.DetectionReport is not None
          assert callable(fa_redact.report_detections)
          assert callable(fa_redact.detection_report)
          sample_report_text = "کد ملی: ۱۲۳۴۵۶۷۸۹۱ و همراه: ۰۹۱۲۳۴۵۶۷۸۹"
          rep = fa_redact.detection_report(sample_report_text)
          assert rep.total_detections == 2
          assert rep.distinct_types == 2
          assert rep.counts["IR_NATIONAL_ID"] == 1
          assert rep.counts["IR_MOBILE"] == 1
          assert not rep.has_conflicts
          assert "۱۲۳۴۵۶۷۸۹۱" not in repr(rep)
          assert "۰۹۱۲۳۴۵۶۷۸۹" not in repr(rep)

          # 9. Phase 19: CLI console script and module execution
          res_console_help = subprocess.run(
              ["./smoke_venv/bin/fa-redact", "--help"],
              capture_output=True,
              text=True,
              check=True,
          )
          assert "detect" in res_console_help.stdout
          assert "redact" in res_console_help.stdout
          assert "report" in res_console_help.stdout

          res_console_ver = subprocess.run(
              ["./smoke_venv/bin/fa-redact", "--version"],
              capture_output=True,
              text=True,
              check=True,
          )
          assert expected_ver in res_console_ver.stdout

          res_cli_help = subprocess.run(
              [sys.executable, "-m", "fa_redact", "--help"],
              capture_output=True,
              text=True,
              check=True,
          )
          assert "detect" in res_cli_help.stdout
          assert "redact" in res_cli_help.stdout
          assert "report" in res_cli_help.stdout

          res_cli_redact = subprocess.run(
              [sys.executable, "-m", "fa_redact", "redact"],
              input="کد ملی: ۱۲۳۴۵۶۷۸۹۱",
              capture_output=True,
              text=True,
              encoding="utf-8",
              check=True,
          )
          assert "[IR_NATIONAL_ID_1]" in res_cli_redact.stdout

          # 10. Phase 20: Structured Data Helpers
          assert callable(fa_redact.detect_fields)
          assert callable(fa_redact.redact_fields)
          assert callable(fa_redact.report_fields)
          orig_record = {
              "patient": {"note": "کد ملی ۱۲۳۴۵۶۷۸۹۱"},
              "contact": "کد ملی ۱۲۳۴۵۶۷۸۹۱ و موبایل ۰۹۱۲۳۴۵۶۷۸۹",
              "age": 45,
          }
          redacted_record = fa_redact.redact_fields(orig_record, ["patient.note", "contact"])
          assert "[IR_NATIONAL_ID_1]" in redacted_record["patient"]["note"]
          assert "[IR_NATIONAL_ID_1]" in redacted_record["contact"]
          assert "[IR_MOBILE_1]" in redacted_record["contact"]
          assert redacted_record["age"] == 45
          # Verify non-destructive guarantee (original record unchanged)
          assert orig_record["patient"]["note"] == "کد ملی ۱۲۳۴۵۶۷۸۹۱"

          # 11. Phase 21.2: Persian NER public packaging boundary
          assert fa_redact.PersianNERDetector is not None
          # Verify importing fa_redact or PersianNERDetector does not require torch or load models
          assert "torch" not in sys.modules, "torch should not be imported unconditionally!"
          assert "transformers" not in sys.modules, "transformers should not be imported unconditionally!"

          # 12. Phase 22: Clinical Redaction Profiles
          assert fa_redact.ClinicalRedactionProfile is not None
          assert fa_redact.ClinicalTextTemplate is not None
          assert callable(fa_redact.clinical_profile)
          clinic_prof = fa_redact.clinical_profile("outpatient_note")
          assert isinstance(clinic_prof, fa_redact.ClinicalRedactionProfile)
          clinical_sample = "بیمار با کد ملی ۱۲۳۴۵۶۷۸۹۱ و ایمیل clinic@example.com مراجعه کرد."
          clinical_redacted = clinic_prof.redact(clinical_sample)
          assert "[IR_NATIONAL_ID_1]" in clinical_redacted
          assert "[EMAIL_1]" in clinical_redacted
          # Ensure profile execution did not pull in heavy ML modules
          assert "torch" not in sys.modules

          # 13. Phase 24: Batch Processing Helpers
          assert callable(fa_redact.detect_many)
          assert callable(fa_redact.redact_many)
          assert callable(fa_redact.report_many)
          batch_docs = [
              "سند اول کد ملی ۱۲۳۴۵۶۷۸۹۱",
              "سند دوم شماره ۰۹۱۲۳۴۵۶۷۸۹",
          ]
          batch_out = list(fa_redact.redact_many(batch_docs))
          assert len(batch_out) == 2
          assert "[IR_NATIONAL_ID_1]" in batch_out[0]
          assert "[IR_MOBILE_1]" in batch_out[1]

          # 14. Phase 26: Structured Serialization
          assert callable(fa_redact.detection_to_dict)
          assert callable(fa_redact.detections_to_list)
          assert callable(fa_redact.report_to_dict)
          assert callable(fa_redact.reports_to_dict)
          assert callable(fa_redact.dumps_detections)
          assert callable(fa_redact.dumps_report)
          assert callable(fa_redact.dumps_reports)
          ser_text = "کد ملی ۱۲۳۴۵۶۷۸۹۱"
          ser_dets = fa_redact.detect(ser_text)
          ser_dets_json = fa_redact.dumps_detections(ser_dets)
          assert "IR_NATIONAL_ID" in ser_dets_json
          assert "1234567891" not in ser_dets_json
          assert "۱۲۳۴۵۶۷۸۹۱" not in ser_dets_json

          ser_rep = fa_redact.detection_report(ser_text)
          ser_rep_json = fa_redact.dumps_report(ser_rep)
          assert "total_detections" in ser_rep_json
          assert "1234567891" not in ser_rep_json
          assert "۱۲۳۴۵۶۷۸۹۱" not in ser_rep_json

          # 15. Phase 28: Legal Entity ID (opt-in behavior)
          assert callable(fa_redact.is_valid_iranian_legal_entity_id)
          _coefs = (29, 27, 23, 19, 17, 29, 27, 23, 19, 17)
          _p = [1, 4, 0, 0, 0, 0, 0, 0, 0, 1]
          _rem = sum((_p[i] + _p[9] + 2) * _coefs[i] for i in range(10)) % 11
          _chk = 0 if _rem == 10 else _rem
          _synth_id = "".join(str(x) for x in _p) + str(_chk)
          assert fa_redact.is_valid_iranian_legal_entity_id(_synth_id)
          assert fa_redact.IranianLegalEntityIDDetector is not None
          leid_detector = fa_redact.IranianLegalEntityIDDetector()
          leid_text = f"شناسه حقوقی {_synth_id} ثبت شد."
          default_dets = fa_redact.detect(leid_text)
          assert len(default_dets) == 0, "Default detect must not detect Legal Entity ID"
          explicit_dets = fa_redact.detect(leid_text, detectors=[leid_detector])
          assert len(explicit_dets) == 1
          assert explicit_dets[0].type == "IR_LEGAL_ENTITY_ID"
          assert explicit_dets[0].value == _synth_id
          assert "research" not in sys.modules, "Research package must not be imported in production"

          print("Release wheel smoke test passed for the current fa-redact release candidate.")
          PY

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fa-redact
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Verify distribution artifacts present
        run: |
          ls -la dist/
          test -f dist/*.whl || (echo "Error: No .whl found in dist/" && exit 1)
          test -f dist/*.tar.gz || (echo "Error: No .tar.gz found in dist/" && exit 1)

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
