name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build & Validate Distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Verify release tag matches package and pyproject versions
        run: |
          TAG="${{ github.event.release.tag_name }}"

          # Enforce strict lowercase 'v' prefix convention
          case "$TAG" in
            v*)
              ;;
            *)
              echo "Error: release tag '$TAG' must start with lowercase 'v' (example: v0.2.0)"
              exit 1
              ;;
          esac

          EXPECTED_VERSION="${TAG#v}"

          if [ -z "$EXPECTED_VERSION" ]; then
              echo "Error: release tag '$TAG' contains no version after 'v'"
              exit 1
          fi

          python -c "
          import sys
          import tomllib
          from pathlib import Path

          sys.path.insert(0, 'src')
          import fa_redact

          expected_ver = sys.argv[1]
          tag_name = sys.argv[2]
          pkg_ver = fa_redact.__version__

          with Path('pyproject.toml').open('rb') as f:
              pyproject_data = tomllib.load(f)
          pyproject_ver = pyproject_data.get('project', {}).get('version')

          print(f'Release tag: {tag_name} -> Expected version: {expected_ver}')
          print(f'pyproject.toml version: {pyproject_ver}')
          print(f'fa_redact.__version__: {pkg_ver}')

          if pyproject_ver != expected_ver:
              raise ValueError(
                  f'Version mismatch: tag specifies {expected_ver} but pyproject.toml has {pyproject_ver}'
              )
          if pkg_ver != expected_ver:
              raise ValueError(
                  f'Version mismatch: tag specifies {expected_ver} but fa_redact.__version__ is {pkg_ver}'
              )
          print('Three-way pre-build version consistency check passed.')
          " "$EXPECTED_VERSION" "$TAG"

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Validate distribution metadata (twine)
        run: |
          python -m twine check dist/*

      - name: Release wheel smoke test in isolated environment
        run: |
          mkdir -p /tmp/release_smoke
          cd /tmp/release_smoke

          TAG="${{ github.event.release.tag_name }}"
          EXPECTED_VERSION="${TAG#v}"

          python -m venv smoke_venv
          ./smoke_venv/bin/python -m pip install --upgrade pip
          ./smoke_venv/bin/python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl

          ./smoke_venv/bin/python - "$EXPECTED_VERSION" <<'PY'
          import sys
          from importlib.metadata import version
          import fa_redact

          expected_ver = sys.argv[1]
          print(f"Imported fa_redact from: {fa_redact.__file__}")

          # 1. Four-way distribution metadata and import path consistency
          assert "site-packages" in fa_redact.__file__, "Not imported from site-packages!"
          assert fa_redact.__version__ == expected_ver, f"Expected runtime version {expected_ver}, got {fa_redact.__version__}"
          dist_ver = version("fa-redact")
          assert dist_ver == expected_ver, f"Expected distribution metadata version {expected_ver}, got {dist_ver}"

          # 2. Existing core (National ID, Mobile, detect, redact, PseudonymizationSession)
          assert callable(fa_redact.is_valid_national_id)
          assert callable(fa_redact.is_valid_mobile_number)
          assert fa_redact.is_valid_national_id("1234567891")
          assert fa_redact.is_valid_mobile_number("09123456789")
          core_redacted = fa_redact.redact("کد ملی: ۱۲۳۴۵۶۷۸۹۱، همراه: ۰۹۱۲۳۴۵۶۷۸۹")
          assert "[IR_NATIONAL_ID_1]" in core_redacted
          assert "[IR_MOBILE_1]" in core_redacted

          session = fa_redact.PseudonymizationSession()
          pseudonymized = session.pseudonymize("کد ملی ۱۲۳۴۵۶۷۸۹۱")
          assert "[IR_NATIONAL_ID_1]" in pseudonymized
          restored = session.restore(pseudonymized)
          assert "۱۲۳۴۵۶۷۸۹۱" in restored

          # 3. Phase 13: Iranian IBAN / Sheba (is_valid_iranian_iban and default detection/redaction)
          assert callable(fa_redact.is_valid_iranian_iban)
          assert fa_redact.is_valid_iranian_iban("IR641234567890123456789012")
          iban_redacted = fa_redact.redact("واریز به شبا IR641234567890123456789012")
          assert "[IR_IBAN_1]" in iban_redacted

          # 4. Phase 12: Email (opt-in behavior)
          assert callable(fa_redact.is_valid_email)
          assert fa_redact.is_valid_email("test@example.com")
          email_detector = fa_redact.EmailDetector()
          email_detections = fa_redact.detect("contact: test@example.com", detectors=[email_detector])
          assert len(email_detections) == 1
          assert email_detections[0].type == "EMAIL"
          # Explicit detector replacement semantics: default detectors not run when explicit list provided
          non_email = fa_redact.detect("کد ملی ۱۲۳۴۵۶۷۸۹۱", detectors=[email_detector])
          assert len(non_email) == 0

          # 5. Phase 14: Bank Card (opt-in behavior, synthetic Luhn-valid 1234567890123452)
          assert callable(fa_redact.is_valid_bank_card_number)
          assert fa_redact.is_valid_bank_card_number("1234567890123452")
          card_detector = fa_redact.BankCardDetector()
          card_detections = fa_redact.detect("کارت 1234567890123452", detectors=[card_detector])
          assert len(card_detections) == 1
          assert card_detections[0].type == "BANK_CARD"

          # 6. Phase 15: PatternDetector / PatternRule
          hospital_detector = fa_redact.PatternDetector(
              [
                  fa_redact.PatternRule(
                      type="MRN",
                      pattern=r"(?<!\w)MRN-[0-9]{6}(?!\w)",
                  )
              ]
          )
          mrn_detections = fa_redact.detect("پرونده: MRN-۱۲۳۴۵۶", detectors=[hospital_detector])
          assert len(mrn_detections) == 1
          assert mrn_detections[0].type == "MRN"
          assert mrn_detections[0].normalized_value == "MRN-123456"
          mrn_redacted = fa_redact.redact("پرونده: MRN-۱۲۳۴۵۶", detectors=[hospital_detector])
          assert "[MRN_1]" in mrn_redacted

          # 7. Phase 16: Conflict Resolution
          assert fa_redact.ConflictPolicy is not None
          assert callable(fa_redact.resolve_detection_conflicts)
          overlap_text = "1234567890123452@example.com"
          dual_detectors = [fa_redact.EmailDetector(), fa_redact.BankCardDetector()]
          raw_conflicts = fa_redact.detect(overlap_text, detectors=dual_detectors)
          assert len(raw_conflicts) == 2  # raw detect preserves overlapping evidence

          # Default reject policy raises ValueError
          try:
              fa_redact.redact(overlap_text, detectors=dual_detectors)
              assert False, "Expected ValueError on unhandled conflict under default reject policy"
          except ValueError:
              pass

          # Longest policy resolves to EMAIL
          resolved_redacted = fa_redact.redact(
              overlap_text,
              detectors=dual_detectors,
              conflict_policy="longest",
          )
          assert resolved_redacted == "[EMAIL_1]"

          print("Release wheel smoke test passed on all v0.2.0 features.")
          PY

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fa-redact
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Verify distribution artifacts present
        run: |
          ls -la dist/
          test -f dist/*.whl || (echo "Error: No .whl found in dist/" && exit 1)
          test -f dist/*.tar.gz || (echo "Error: No .tar.gz found in dist/" && exit 1)

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
