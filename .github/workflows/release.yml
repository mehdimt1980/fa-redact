name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build & Validate Distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Verify release tag matches package version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          EXPECTED_VERSION="${TAG#v}"
          python -c "
          import sys
          sys.path.insert(0, 'src')
          import fa_redact
          pkg_ver = fa_redact.__version__
          expected_ver = sys.argv[1]
          print(f'Release tag: {sys.argv[2]} (expected: {expected_ver}), Package version: {pkg_ver}')
          if pkg_ver != expected_ver:
              raise ValueError(f'Version mismatch: tag specifies {expected_ver} but package has {pkg_ver}')
          print('Version consistency check passed.')
          " "$EXPECTED_VERSION" "$TAG"

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Validate distribution metadata (twine)
        run: |
          python -m twine check dist/*

      - name: Release wheel smoke test in isolated environment
        run: |
          mkdir -p /tmp/release_smoke
          cd /tmp/release_smoke

          TAG="${{ github.event.release.tag_name }}"
          EXPECTED_VERSION="${TAG#v}"

          python -m venv smoke_venv
          ./smoke_venv/bin/python -m pip install --upgrade pip
          ./smoke_venv/bin/python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl

          ./smoke_venv/bin/python - "$EXPECTED_VERSION" <<'PY'
          import sys
          import fa_redact

          expected_ver = sys.argv[1]
          print(f"Imported fa_redact from: {fa_redact.__file__}")

          assert "site-packages" in fa_redact.__file__, "Not imported from site-packages!"
          assert fa_redact.__version__ == expected_ver, f"Expected version {expected_ver}, got {fa_redact.__version__}"

          assert callable(fa_redact.detect)
          assert callable(fa_redact.redact)
          assert callable(fa_redact.is_valid_national_id)
          assert callable(fa_redact.is_valid_mobile_number)
          assert fa_redact.PseudonymizationSession is not None

          result = fa_redact.redact("کد ملی: ۱۲۳۴۵۶۷۸۹۱")
          assert "[IR_NATIONAL_ID_1]" in result

          print("Release wheel smoke test passed.")
          PY

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fa-redact
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Verify distribution artifacts present
        run: |
          ls -la dist/
          test -f dist/*.whl || (echo "Error: No .whl found in dist/" && exit 1)
          test -f dist/*.tar.gz || (echo "Error: No .tar.gz found in dist/" && exit 1)

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26 # v1.14.2
