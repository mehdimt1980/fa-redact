name: Bug Report
description: File a bug report or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **Privacy Notice**: Do NOT include real patient records, personal PII, production credentials, or secrets in this issue. Use only synthetic or algorithmic sample data.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction Code
      description: Provide a minimal code snippet using synthetic test data that demonstrates the issue.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python Version
      placeholder: "e.g. 3.10, 3.11, 3.12, 3.13"
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: fa-redact Version
      placeholder: "e.g. 0.1.0"
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context or logs about the problem here (ensuring no sensitive data is included).
