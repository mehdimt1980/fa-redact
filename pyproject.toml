[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fa-redact"
version = "0.1.0"
description = "A privacy-first Python toolkit for Persian/Iranian PII redaction and pseudonymization, designed especially for healthcare and AI applications."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "fa-redact contributors" }
]
keywords = [
    "persian",
    "farsi",
    "pii",
    "redaction",
    "anonymization",
    "pseudonymization",
    "privacy",
    "healthcare",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.0.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "ruff>=0.9.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/mehdimt1980/fa-redact"
Repository = "https://github.com/mehdimt1980/fa-redact"
Issues = "https://github.com/mehdimt1980/fa-redact/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fa_redact = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
